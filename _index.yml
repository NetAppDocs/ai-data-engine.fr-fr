---
indexpage:
  title: Documentation AI Data Engine
  summary: La documentation AI Data Engine explique comment déployer, connecter des
    sources de données et utiliser AI Data Engine pour l’optimisation du stockage,
    l’analyse des métadonnées, la gouvernance des données et l’accès contrôlé à l’IA
    via MCP.
  keywords: ai data engine, aide, storage optimization, investigation, policies, data
    governance, NetApp Console, governed ai access, mcp, model context protocol
  lead: AI Data Engine est un service d'intelligence des métadonnées, géré via NetApp
    Console, qui analyse vos systèmes connectés, crée un catalogue de métadonnées
    et vous offre la visibilité et les outils nécessaires pour optimiser le stockage
    et assurer la gouvernance des données à grande échelle. Grâce à un accès contrôlé
    à l'IA, les clients IA peuvent interroger ces métadonnées via le Model Context
    Protocol (MCP).
